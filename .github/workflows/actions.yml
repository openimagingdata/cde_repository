name: Run Main Script and Commit Changes

on:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-main-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2 # checkout the repository content to github runner

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12" # install the python version needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        run: python cde_repository/main.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cde_repository/cde_sets/*.json
          git add cde_repository/cde_sets_docs/*.md
          git add cde_repository/invalid_cde_sets/*.json
          git add cde_repository/invalid_cde_sets/*.txt
          git add cde_repository/status.log
          git commit -m 'Automated commit of generated files and logs'
          git push

      - name: push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
